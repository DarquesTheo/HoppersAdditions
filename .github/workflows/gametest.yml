name: Minecraft 1.21.11 GameTests

on:
  pull_request:
    branches: [master]
  push:
    branches: [master, 'feat/8-minecraft-1.21.11', 'test/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gametest-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gametest:
    name: GameTests (${{ matrix.loader }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        loader: [fabric, neoforge]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '21'
      - name: Build normal distributables and test-only sources
        run: sh ./gradlew :common:build :fabric:build :neoforge:build :${{ matrix.loader }}:gametestClasses --console=plain --no-daemon
      - name: Verify production packages, exclusion fixtures and report gate
        shell: pwsh
        run: |
          ./tools/release/Verify-ReleaseArtifacts.ps1
          ./tools/release/Test-ReleaseArtifacts.ps1
          ./tools/gametest/Test-ResultGate.ps1
          ./tools/gametest/Test-RunnerInvocation.ps1
      - name: Run real Minecraft suite and failure/discovery probes
        shell: pwsh
        env:
          EULA_AUTHORIZED: ${{ vars.HOPPERS_GAMETEST_EULA_ACCEPTED }}
        run: |
          if ($env:EULA_AUTHORIZED -cne 'true') {
            throw 'Maintainer authorization required: read the Minecraft EULA, then set repository variable HOPPERS_GAMETEST_EULA_ACCEPTED=true. No test server started.'
          }
          ./tools/gametest/Run-GameTests.ps1 -Loader ${{ matrix.loader }} -EulaAccepted -ValidateGuards
      - name: Upload reports and logs even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gametest-${{ matrix.loader }}
          if-no-files-found: warn
          path: |
            **/build/gametest/*.xml
            **/build/gametest/*.log
            **/build/gametest/run/logs/*.log
            **/build/gametest/run/crash-reports/*.txt
            build/issue8-evidence/*.json
            build/issue8-fixtures/**/fixtures.json
